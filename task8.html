<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 8 - Обратная связь</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        #open-btn { margin: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
        
        /* Попап поверх страницы */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none;
            align-items: center; justify-content: center; z-index: 1000;
        }
        
        /* Компактный дизайн для мобильных устройств (без прокрутки) */
        #popup {
            background: #fff; padding: 12px; border-radius: 8px;
            width: 95%; max-width: 320px; box-sizing: border-box;
            display: flex; flex-direction: column; gap: 4px;
        }
        #popup h2 { margin: 0 0 5px; font-size: 16px; text-align: center; }
        .field { display: flex; flex-direction: column; }
        .field label { font-size: 12px; margin-bottom: 2px; }
        .field input, .field textarea {
            padding: 4px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px;
        }
        .field textarea { resize: none; rows: 2; }
        .checkbox-field { flex-direction: row; align-items: center; gap: 5px; font-size: 11px; margin-top: 5px; }
        
        #status { font-size: 12px; text-align: center; min-height: 14px; font-weight: bold; }
        
        .buttons { display: flex; justify-content: space-between; margin-top: 10px; }
        .buttons button { padding: 6px 12px; cursor: pointer; font-size: 14px; }
    </style>
    <!-- Подключение скрипта -->
    <script src="script8.js" defer></script>
</head>
<body>
    <button id="open-btn">Открыть форму обратной связи</button>

    <!-- Попап -->
    <div id="overlay">
        <div id="popup">
            <h2>Свяжитесь с нами</h2>
            <!-- Блок для сообщений об ошибке или успехе -->
            <div id="status"></div>
            
 <form id="feedback-form">
    <div class="field">
        <label>ФИО</label>
        <input type="text" name="fio" pattern="^[А-ЯЁA-Z][а-яёa-z]+\s[А-ЯЁA-Z][а-яёa-z]+\s[А-ЯЁA-Z][а-яёa-z]+$" title="Введите ровно 3 слова, каждое с большой буквы (например: Иванов Иван Иванович). Цифры запрещены." required>
    </div>
    <div class="field">
        <label>Email</label>
        <input type="email" name="email" required>
    </div>
    <div class="field">
        <label>Телефон</label>
        <input type="tel" name="phone" pattern="(\+7|8)?[0-9]{10}" title="Формат: +7... или 10 цифр" required>
    </div>
    <div class="field">
        <label>Организация</label>
        <input type="text" name="org" required>
    </div>
    <div class="field">
        <label>Сообщение</label>
        <textarea name="msg" rows="2" required></textarea>
    </div>
    <div class="field checkbox-field">
        <input type="checkbox" name="agree" id="agree" required>
        <label for="agree">Согласен с политикой обработки персональных данных</label>
    </div>
    
    <div class="buttons">
        <button type="button" id="close-btn">Закрыть</button>
        <button type="submit" id="submit-btn">Отправить</button>
    </div>
</form>
        </div>
    </div>
</body>
</html>
