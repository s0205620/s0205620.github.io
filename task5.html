<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 5 - Калькулятор</title>
    
    <!-- Подключение внешнего JS-файла с атрибутом defer (строго по заданию) -->
    <script src="script5.js" defer></script>
</head>
<body>
    <h1>Калькулятор стоимости заказа</h1>
    
    <form id="calculator-form">
        <!-- Текстовое поле для ввода количества товара -->
        <label for="quantity">Количество товара:</label>
        <input type="text" id="quantity" name="quantity" placeholder="Введите количество">
        <br><br>

        <!-- Выбор товара из списка (не менее 3 товаров с разной ценой) -->
        <label for="product">Выберите товар:</label>
        <select id="product" name="product">
            <option value="500">Товар 1 (500 руб.)</option>
            <option value="1200">Товар 2 (1200 руб.)</option>
            <option value="3500">Товар 3 (3500 руб.)</option>
            <option value="5000">Товар 4 (5000 руб.)</option>
        </select>
        <br><br>

        <!-- Кнопка подсчета стоимости -->
        <button id="calculate-btn">Рассчитать стоимость</button>
    </form>

    <br>
    <!-- Блок для вывода результата или сообщения об ошибке -->
    <div id="result"></div>
</body>
</html>
